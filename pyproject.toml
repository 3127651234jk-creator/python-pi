[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-python"
version = "0.1.0"
description = "Python port of the pi coding agent core: ai provider layer, agent loop, and the four coding tools."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "Pillow>=9.2",
    "PyYAML==6.0.3",
    "prompt_toolkit==3.0.52",
    "wcwidth==0.2.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
bedrock = ["boto3==1.40.75"]

[project.scripts]
pi = "pi.coding_agent.cli:main"

[tool.setuptools.packages.find]
include = ["pi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
