name: Standalone daemons
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  freeze:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyInstaller==6.16.0
      - run: python scripts/build_daemon.py
      - run: python -m pip install -e . pytest==8.4.2
      - run: python -m pytest tests/test_daemon_distribution.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.runner }}
          path: pi/env/bin/
  wheel:
    needs: freeze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: daemon-*
          path: pi/env/bin/
          merge-multiple: true
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
